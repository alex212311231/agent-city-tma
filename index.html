<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e20">
  <title>Город агентов</title>
  <link rel="stylesheet" href="./office.css?v=1ce81d6a4f0a">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./1e6b8fde05308"></script>
</head>
<body>
  <main class="app" id="app">
    <div id="world" class="world">
      <canvas id="city" aria-label="Трёхмерная карта города. Перетаскивание вращает камеру, щипок или колёсико меняет масштаб."></canvas>
      <div id="markers" class="markers"></div>
      <div class="horizon" aria-hidden="true"></div>
    </div>

    <header class="topbar">
      <div class="identity">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1>Город агентов</h1>
      </div>
      <div id="connection" class="connection" role="status" data-mode="demo">Демо</div>
    </header>

    <aside id="district" class="district glass" aria-label="Выбранное место" hidden>
      <div>
        <div class="xray"><span aria-hidden="true"></span><b id="district-mode">РЕНТГЕН</b></div>
        <h2 id="district-name"></h2>
        <p id="district-description"></p>
      </div>
      <button id="overview" class="overview" type="button">Обзор всего города</button>
    </aside>

    <div class="bottom">
      <nav class="districts" aria-label="Районы города">
        <button type="button" data-district="hq" aria-pressed="false" style="--district-color:#ffcc91">Таймс-сквер</button>
        <button type="button" data-district="moex" aria-pressed="false" style="--district-color:#72aaff">MOEX</button>
        <button type="button" data-district="grants" aria-pressed="false" style="--district-color:#67f5b0">Радар</button>
        <button type="button" data-district="dev" aria-pressed="false" style="--district-color:#51eeff">Dev Lab</button>
        <button type="button" data-district="lounge" aria-pressed="false" style="--district-color:#fc93ee">Cyber Lounge</button>
      </nav>
      <section class="dashboard glass" aria-labelledby="agents-heading">
        <div class="dashboard-header">
          <div>
            <h2 id="agents-heading">Агенты</h2>
            <p id="note">Подключаемся к серверу статусов…</p>
          </div>
          <div class="dashboard-controls">
            <button id="demo" class="demo-button" type="button" aria-pressed="false">
              <span class="play" aria-hidden="true"></span><span id="demo-label">Демо-режим (Экшн)</span>
            </button>
            <button id="new-task" class="primary-button" type="button" hidden>Новое задание</button>
          </div>
        </div>
        <div id="agent-inspection" class="agent-inspection" hidden>
          <div><strong id="inspection-agent"></strong> <span id="inspection-action"></span><p id="inspection-detail"></p></div>
          <button id="district-view" class="outline-button" type="button">Вид этажа</button>
        </div>
        <div id="orbital-status" class="orbital-status" role="status" hidden>
          <strong id="orbital-stage"></strong><span id="orbital-detail"></span>
        </div>
        <p id="task-receipt" class="task-receipt" role="status" hidden></p>
        <div id="agents" class="agents"></div>
        <div id="job-status" class="job-status" aria-label="Фоновые задачи" hidden></div>
      </section>
      <p id="world-help" class="world-help">Свайп для поворота · Щипок для зума · Тап для осмотра</p>
    </div>
  </main>
  <dialog id="task-dialog" class="task-dialog" aria-labelledby="task-title">
    <form id="task-form">
      <div class="task-heading">
        <h2 id="task-title">Новое задание</h2>
        <button id="close-task" type="button" class="outline-button" aria-label="Закрыть">×</button>
      </div>
      <label for="task-project">Проект</label>
      <select id="task-project" name="project">
        <option value="dev">Dev Lab</option>
        <option value="moex">MOEX Quant Terminal</option>
        <option value="grants">Радар грантов</option>
      </select>
      <label for="task-text">Что нужно сделать</label>
      <textarea id="task-text" name="task" rows="5" maxlength="6000" required></textarea>
      <label class="send-files"><input id="send-files" type="checkbox"> Прислать готовые файлы в Telegram</label>
      <p id="task-message" role="status" hidden></p>
      <button id="submit-task" class="primary-button" type="submit">Запустить</button>
    </form>
  </dialog>
</body>
</html>
