<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff2ed">
  <meta name="description" content="Пульт AI Hub — сводки источников и живой журнал агентов.">
  <title>Пульт · AI Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%2310332c'/%3E%3Cpath d='M10 33l9-18h5l-9 18zm12 0 9-18h6l-9 18z' fill='%23c7ed83'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./office.css?v=desk1">
  <script src="./config.js" defer></script>
  <script src="./office.js?v=desk1" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span>AI Hub</div>
      <div id="connection" class="connection" role="status"><i></i><span>Подключение</span></div>
    </div>
  </header>
  <main>
    <section id="data-view" role="tabpanel" aria-labelledby="data-tab">
      <div class="section-head"><div><p class="eyebrow" id="today"></p><h1>Данные</h1></div><button id="sync" class="icon-button" type="button" title="Обновить сводки" aria-label="Обновить сводки"></button></div>
      <div class="deck">
        <article id="card" class="sheet" aria-label="Карточка источника" tabindex="0"></article>
      </div>
      <div class="deck-actions">
        <button id="skip" class="secondary" type="button"><span class="ico" data-icon="left"></span>Пропустить</button>
        <button id="pin" class="primary" type="button"><span class="ico" data-icon="pin"></span><span id="pin-text">Закрепить</span></button>
      </div>
      <div class="deck-nav" id="deck-nav" aria-label="Выбрать источник"></div>
      <section id="saved" hidden><h2>Закреплено</h2><div id="pins"></div></section>
    </section>
    <section id="team-view" role="tabpanel" aria-labelledby="team-tab" hidden>
      <div class="section-head"><div><p class="eyebrow">Журнал работы</p><h1>Агенты</h1></div><a class="icon-button" href="https://t.me/ClaudeNFications_bot" aria-label="Написать задание в Telegram" title="Написать задание в Telegram"><span class="ico" data-icon="send"></span></a></div>
      <article id="lead" class="lead"></article>
      <section id="preview" hidden><button type="button" id="view-video" class="secondary">Посмотреть готовый ролик</button><p id="video-status" role="status"></p><video id="clip" controls playsinline hidden></video></section>
      <section><div class="list-head"><h2>Команда</h2><span id="count" class="count"></span></div><div id="agents"></div></section>
    </section>
    <p id="access" class="access" hidden></p>
    <p id="feedback" class="sr" role="status"></p>
  </main>
  <div class="bottom"><nav role="tablist" aria-label="Разделы">
    <button id="data-tab" type="button" role="tab" aria-controls="data-view" aria-selected="true"><span class="ico" data-icon="layers"></span>Данные</button>
    <button id="team-tab" type="button" role="tab" aria-controls="team-view" aria-selected="false" tabindex="-1"><span class="ico" data-icon="team"></span>Агенты</button>
  </nav></div>
</body>
</html>
