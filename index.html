<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8f0f5">
  <meta name="description" content="Зимний офис AI Hub. Задания, маршруты и рабочие места агентов.">
  <title>Зимний город · AI Hub</title>
  <link rel="stylesheet" href="./office.css?v=0eadce7290ec">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "city/world":"./city-world.mjs?v=2a7367f43fb0",
      "city/navigation":"./city-navigation.mjs?v=4a95ca0200e6",
      "city/displays":"./city-displays.mjs?v=3f54c21c24a7",
      "city/music":"./city-music.mjs?v=16ecba2176dc"}}
  </script>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./office.js?v=587be271d6ec"></script>
</head>
<body>
  <main class="app" id="app">
    <div id="world" class="world">
      <canvas id="city" tabindex="0" aria-label="Зимний 3D-город. Перетаскивайте для поворота, используйте колёсико или щипок для зума."></canvas>
      <div id="markers" class="markers" aria-label="Здания города"></div>
    </div>

    <header class="topbar chrome">
      <div class="identity">
        <span class="mark" aria-hidden="true">❄</span>
        <div><span class="brand">AI HUB</span><h1>Зимний город</h1></div>
      </div>
      <div class="top-controls">
        <div id="connection" class="connection" role="status" data-mode="demo">Демо</div>
        <button id="music-toggle" class="icon" type="button" aria-label="Включить музыку" aria-pressed="false" title="Музыка">♪</button>
        <button id="settings-toggle" class="icon" type="button" aria-label="Настройки города" title="Настройки">⚙</button>
      </div>
    </header>

    <div class="camera-switch glass" role="group" aria-label="Режим камеры">
      <button type="button" id="orbit-mode" aria-label="Обзор города" aria-pressed="true">Обзор</button>
      <button type="button" id="walk-mode" aria-label="От 1-го лица (Прогулка)" aria-pressed="false" disabled>Прогулка</button>
    </div>
    <div id="walk-hud" class="walk-hud" hidden>
      <p id="walk-place" class="walk-place glass">Улица</p>
      <p class="walk-help glass">WASD · Shift для ускорения · Зажмите левую кнопку для обзора</p>
      <div class="joystick joystick-left" id="walk-move" aria-label="Движение"><i aria-hidden="true"></i></div>
      <div class="joystick joystick-right" id="walk-look" aria-label="Поворот камеры"><i aria-hidden="true"></i></div>
      <span class="walk-target" aria-hidden="true"></span>
    </div>

    <aside id="district" class="district glass chrome" aria-label="Выбранное место" hidden>
      <div><p id="district-mode" class="district-mode">Интерьер</p><h2 id="district-name"></h2><p id="district-description"></p></div>
      <button id="overview" class="outline-button" type="button">К городу</button>
    </aside>

    <section class="dock" id="dock" aria-label="Управление городом">
      <button id="board-toggle" class="board-toggle glass" type="button" aria-expanded="true" aria-controls="board">
        <span class="grip" aria-hidden="true"></span><span id="board-label">Свернуть панель</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="board" class="board glass">
        <nav class="districts" aria-label="Районы города">
          <button type="button" data-district="hq" aria-pressed="false">Эмпайр-стейт</button>
          <button type="button" data-district="moex" aria-pressed="false">MOEX</button>
          <button type="button" data-district="grants" aria-pressed="false">Радар</button>
          <button type="button" data-district="dev" aria-pressed="false">Dev Lab</button>
          <button type="button" data-district="lounge" aria-pressed="false">Парк</button>
        </nav>
        <div class="board-scroll">
          <div class="dashboard-header">
            <div><h2>Агенты</h2><p id="note">Подключаемся к серверу статусов…</p></div>
            <div class="dashboard-controls">
              <button id="demo" class="outline-button demo-button" type="button" aria-pressed="false"><span id="demo-label">Демо</span></button>
              <button id="new-task" class="primary-button" type="button" hidden>Новое задание</button>
            </div>
          </div>
          <div id="agent-inspection" class="agent-inspection" hidden>
            <div><strong id="inspection-agent"></strong> <span id="inspection-action"></span><p id="inspection-detail"></p></div>
            <button id="district-view" class="outline-button" type="button">Осмотреть этаж</button>
          </div>
          <div id="orbital-status" class="orbital-status" role="status" hidden><strong id="orbital-stage"></strong><span id="orbital-detail"></span></div>
          <p id="task-receipt" class="task-receipt" role="status" hidden></p>
          <div id="agents" class="agents"></div>
          <div id="job-status" class="job-status" aria-label="Фоновые задачи" hidden></div>
          <p id="world-help" class="world-help" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <dialog id="task-dialog" class="task-dialog" aria-labelledby="task-title">
    <form id="task-form">
      <div class="task-heading">
        <h2 id="task-title">Новое задание</h2>
        <button id="close-task" type="button" class="icon" aria-label="Закрыть">×</button>
      </div>
      <label for="task-project">Проект</label>
      <select id="task-project" name="project">
        <option value="dev">Dev Lab</option><option value="moex">MOEX Quant Terminal</option><option value="grants">Радар грантов</option>
      </select>
      <label for="task-text">Что нужно сделать</label>
      <textarea id="task-text" name="task" rows="5" maxlength="6000" required></textarea>
      <label class="checkbox"><input id="send-files" type="checkbox"> Прислать готовые файлы в Telegram</label>
      <p id="task-message" role="status" hidden></p>
      <button id="submit-task" class="primary-button" type="submit">Запустить</button>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="task-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="task-heading"><h2 id="settings-title">Настройки города</h2><button class="icon" aria-label="Закрыть">×</button></div>
      <label for="light">Время суток</label>
      <select id="light"><option value="day">День</option><option value="auto">По местному времени</option><option value="dusk">Вечер</option><option value="night">Ночь</option></select>
      <label for="transport">Как агенты добираются</label>
      <select id="transport"><option value="mixed">Пешком и на машинах</option><option value="walk">Пешком</option><option value="car">На машинах</option></select>
      <label class="checkbox"><input id="snow" type="checkbox"> Снегопад</label>
      <label class="checkbox"><input id="music" type="checkbox"> Новогодняя музыка</label>
      <label for="volume">Громкость <output id="volume-value">30%</output></label>
      <input id="volume" type="range" min="0" max="100" value="30">
      <button id="reset-settings" class="outline-button" type="button">Сбросить настройки</button>
    </form>
  </dialog>
</body>
</html>
