<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121b">
  <title>Агентный офис</title>
  <link rel="stylesheet" href="./office.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./office.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Агентный офис</h1>
      <span id="connection" class="connection" role="status" data-mode="demo">Демо</span>
    </header>
    <figure>
      <canvas id="map" width="320" height="184" role="img" aria-label="Пиксельный офис со столами, серверной и зоной отдыха"></canvas>
      <figcaption><span>Рабочие места</span><span>Серверная</span><span>Зона отдыха</span></figcaption>
    </figure>
    <section id="agents" aria-label="Статусы агентов"></section>
    <footer><p id="note">Демонстрация движения и состояний агентов.</p><button id="retry" type="button" hidden>Подключиться</button></footer>
  </main>
</body>
</html>
